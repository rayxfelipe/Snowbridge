[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowbridge"
version = "0.1.0"
description = "A platform-neutral HTTP bridge between Azure orchestrators and Snowflake."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.16,<5"]
ai = [
    "azure-identity>=1.25,<2",
    "openai>=1.109,<3",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snowbridge"]

[tool.hatch.build.targets.wheel.force-include]
"src/snowbridge/static" = "snowbridge/static"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
